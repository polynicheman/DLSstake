<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#070d16" />
<title>Match History — DLS Stake</title>
<meta name="description" content="Your full DLS Stake match history — results, opponents, and P&L." />

<style>
:root{
  --bg:#070d16; --bg-2:#0b1420;
  --surface:#111d2e; --surface-2:#16263b; --surface-3:#1c3049;
  --border:#1e3048; --border-2:#27405f;
  --primary:#00d97e; --primary-dark:#00a860; --primary-glow:rgba(0,217,126,.25);
  --accent:#2f80ed; --danger:#ff4d5e; --danger-dark:#d93a4a;
  --warn:#ffb020; --purple:#8b5cf6; --fire:#ff6b35;
  --text:#e6eef8; --text-2:#b8c9dc;
  --muted:#7b90a8; --muted-2:#556b85;
  --radius-sm:8px; --radius:14px; --radius-lg:22px; --radius-full:999px;
  --shadow:0 8px 28px rgba(0,0,0,.45);
  --shadow-sm:0 3px 12px rgba(0,0,0,.35);
  --ff:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --ff-mono:'SF Mono',ui-monospace,'Cascadia Code',Consolas,monospace;
  --nav-h:62px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--ff);background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(900px 500px at 12% -8%, rgba(0,217,126,.10), transparent 60%),
  radial-gradient(800px 500px at 88% 4%, rgba(47,128,237,.12), transparent 62%),
  radial-gradient(700px 700px at 50% 110%, rgba(139,92,246,.06), transparent 60%);}
.wrap{width:100%;max-width:960px;margin:0 auto;padding:0 20px;position:relative;z-index:1}
.hidden{display:none !important}

/* NAV */
.nav{position:sticky;top:0;z-index:60;height:var(--nav-h);background:rgba(7,13,22,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.nav-inner{height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,var(--primary),var(--accent));display:grid;place-items:center;font-weight:900;font-size:.85rem;color:#04140c;box-shadow:0 4px 14px var(--primary-glow)}
.brand-text{font-weight:900;font-size:1.06rem;letter-spacing:-.03em}
.brand-text span{color:var(--primary)}
.nav-links{display:none;gap:26px;font-size:.88rem;font-weight:600;color:var(--muted)}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--primary)}
@media(min-width:980px){.nav-links{display:flex}}
.nav-user{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border-radius:var(--radius-full);background:var(--surface);border:1px solid var(--border);cursor:pointer}
.nav-user:hover{background:var(--surface-2)}
.nav-user .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(140deg,var(--primary),var(--accent));display:grid;place-items:center;color:#04140c;font-weight:900;font-size:.72rem}
.nav-user .name{font-size:.82rem;font-weight:700}
@media(max-width:520px){.nav-user .name{display:none}}

/* LAYOUT */
.page{padding:36px 0 80px}
.page-head{margin-bottom:22px}
.eyebrow{font-size:.7rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--primary);margin-bottom:6px}
.page-title{font-size:1.8rem;font-weight:900;letter-spacing:-.035em;line-height:1.1}
.page-sub{font-size:.88rem;color:var(--muted);margin-top:6px}

/* SUMMARY */
.summary{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);margin-bottom:24px}
@media(min-width:720px){.summary{grid-template-columns:repeat(4,1fr)}}
.sum-card{background:linear-gradient(180deg,var(--surface-2),var(--bg-2));border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px;text-align:center;position:relative;overflow:hidden}
.sum-card .k{font-size:.64rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.sum-card .v{font-family:var(--ff-mono);font-size:1.35rem;font-weight:900;letter-spacing:-.03em;line-height:1.1}
.sum-card .v.green{color:var(--primary)}
.sum-card .v.fire{color:var(--fire)}
.sum-card .v.warn{color:var(--warn)}
.sum-card .v.blue{color:#7cb4ff}
.sum-card .sub{font-size:.68rem;color:var(--muted-2);margin-top:5px}
.sum-card.green-glow{background:linear-gradient(180deg,rgba(0,217,126,.1),var(--bg-2));border-color:rgba(0,217,126,.32)}
.sum-card.fire-glow{background:linear-gradient(180deg,rgba(255,107,53,.1),var(--bg-2));border-color:rgba(255,107,53,.32)}

/* CONTROLS */
.controls{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-ms-overflow-style:none}
.filter-row::-webkit-scrollbar{display:none}
.chip{padding:9px 15px;border-radius:var(--radius-full);background:var(--surface-2);border:1px solid var(--border);font-size:.8rem;font-weight:800;color:var(--muted);cursor:pointer;transition:.15s;white-space:nowrap;display:flex;align-items:center;gap:6px;flex-shrink:0}
.chip:hover{border-color:var(--border-2);color:var(--text-2)}
.chip.active{background:rgba(0,217,126,.12);border-color:rgba(0,217,126,.4);color:var(--primary)}
.chip.active.demo{background:linear-gradient(180deg,rgba(47,128,237,.16),rgba(47,128,237,.08));color:#7cb4ff;border-color:rgba(47,128,237,.42)}
.chip .cnt{font-family:var(--ff-mono);font-size:.66rem;padding:1px 6px;border-radius:var(--radius-full);background:var(--surface);border:1px solid var(--border)}
.chip.active .cnt{background:rgba(0,217,126,.2);border-color:rgba(0,217,126,.4)}
.chip.active.demo .cnt{background:rgba(47,128,237,.24);border-color:rgba(47,128,237,.5);color:#bfd9ff}

/* MATCH LIST */
.list{display:grid;gap:12px}
.match-card{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.match-card:hover{border-color:var(--border-2);transform:translateY(-2px);box-shadow:var(--shadow)}
.match-card.win{border-left:4px solid var(--primary)}
.match-card.loss{border-left:4px solid var(--fire)}
.match-card.draw{border-left:4px solid var(--warn)}
.match-card.pending{border-left:4px solid var(--accent)}

.mc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.mc-badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:var(--radius-full);display:inline-flex;align-items:center;gap:5px}
.badge.win{background:rgba(0,217,126,.14);color:var(--primary);border:1px solid rgba(0,217,126,.3)}
.badge.loss{background:rgba(255,107,53,.14);color:var(--fire);border:1px solid rgba(255,107,53,.3)}
.badge.draw{background:rgba(255,176,32,.14);color:var(--warn);border:1px solid rgba(255,176,32,.3)}
.badge.pending{background:rgba(47,128,237,.14);color:#7cb4ff;border:1px solid rgba(47,128,237,.3)}
.badge.demo{background:rgba(47,128,237,.12);color:#7cb4ff;border:1px solid rgba(47,128,237,.3)}
.badge.real{background:rgba(0,217,126,.12);color:var(--primary);border:1px solid rgba(0,217,126,.3)}
.badge i{width:5px;height:5px;border-radius:50%;background:currentColor}
.mc-code{font-family:var(--ff-mono);font-size:.7rem;color:var(--muted-2)}
.mc-when{font-family:var(--ff-mono);font-size:.72rem;color:var(--muted)}

.mc-body{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-bottom:14px}
.mc-player{display:flex;align-items:center;gap:11px;min-width:0}
.mc-player.right{flex-direction:row-reverse;text-align:right}
.mc-player .avatar{width:40px;height:40px;min-width:40px;border-radius:12px;background:linear-gradient(140deg,var(--primary),var(--accent));display:grid;place-items:center;color:#04140c;font-weight:900;font-size:.82rem}
.mc-player .avatar.opp{background:linear-gradient(140deg,#2f80ed,#1f66c9);color:#fff}
.mc-player .txt{min-width:0}
.mc-player .txt h4{font-size:.9rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.mc-player.right .txt h4{justify-content:flex-end}
.mc-player .txt p{font-size:.7rem;color:var(--muted);font-family:var(--ff-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.you-tag{font-size:.54rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:var(--radius-full);background:rgba(0,217,126,.14);color:var(--primary);border:1px solid rgba(0,217,126,.3)}

.mc-score{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:80px}
.mc-score .nums{font-family:var(--ff-mono);font-size:1.6rem;font-weight:900;letter-spacing:-.02em;line-height:1;display:flex;gap:8px;align-items:center}
.mc-score .nums .sep{color:var(--muted-2);font-size:1.2rem}
.mc-score .nums .w{color:var(--primary)}
.mc-score .nums .l{color:var(--text-2)}
.mc-score .nums .d{color:var(--warn)}
.mc-score .lbl{font-size:.6rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}

.mc-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-top:12px;border-top:1px solid var(--border);flex-wrap:wrap}
.mc-stat{display:flex;gap:16px;flex-wrap:wrap}
.mc-stat .item{display:flex;flex-direction:column;gap:2px}
.mc-stat .item .k{font-size:.6rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.mc-stat .item .v{font-family:var(--ff-mono);font-size:.82rem;font-weight:800;color:var(--text-2)}
.mc-payout{font-family:var(--ff-mono);font-size:1.05rem;font-weight:900;letter-spacing:-.02em}
.mc-payout.pos{color:var(--primary)}
.mc-payout.neg{color:var(--fire)}
.mc-payout.neu{color:var(--warn)}

/* LOAD MORE */
.load-more{display:flex;justify-content:center;margin-top:24px}

/* EMPTY */
.empty{padding:70px 24px;text-align:center;background:var(--surface);border:1px dashed var(--border-2);border-radius:var(--radius-lg)}
.empty .ico{font-size:2.6rem;margin-bottom:14px;opacity:.7}
.empty h3{font-size:1.05rem;font-weight:800;margin-bottom:8px}
.empty p{font-size:.86rem;color:var(--muted);max-width:400px;margin:0 auto 20px;line-height:1.6}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 22px;border-radius:var(--radius-full);font-weight:800;font-size:.9rem;border:1px solid transparent;cursor:pointer;transition:transform .12s,box-shadow .18s,opacity .18s,background .18s;white-space:nowrap}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(180deg,var(--primary),var(--primary-dark));color:#04140c;box-shadow:0 6px 20px var(--primary-glow)}
.btn-primary:hover:not(:disabled){filter:brightness(1.06)}
.btn-ghost{background:var(--surface);color:var(--text);border-color:var(--border-2)}
.btn-ghost:hover:not(:disabled){background:var(--surface-2)}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border-2)}
.btn-outline:hover:not(:disabled){background:rgba(255,255,255,.04)}
.btn-sm{padding:10px 18px;font-size:.82rem}

/* FOOTER */
footer{border-top:1px solid var(--border);margin-top:60px;padding:28px 0 40px}
.foot-inner{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted-2)}
.foot-links{display:flex;flex-wrap:wrap;gap:20px}
.foot-links a:hover{color:var(--text)}

/* TOASTS */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:9px;width:calc(100% - 32px);max-width:400px;pointer-events:none}
.toast{display:flex;align-items:flex-start;gap:11px;padding:13px 15px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--border-2);box-shadow:var(--shadow);font-size:.86rem;animation:toastIn .28s cubic-bezier(.2,.9,.3,1.2);pointer-events:auto}
.toast.out{animation:toastOut .22s forwards}
.toast.ok{border-color:rgba(0,217,126,.4);background:linear-gradient(180deg,#0f2a1e,#0b1d15)}
.toast.err{border-color:rgba(255,77,94,.4);background:linear-gradient(180deg,#2a1015,#1d0b0e)}
.toast.info{border-color:rgba(47,128,237,.4);background:linear-gradient(180deg,#0f1f33,#0b1622)}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.97)}}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid rgba(0,217,126,.25);border-top-color:var(--primary);animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* LOADING */
.loading-card{padding:60px 22px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);color:var(--muted);font-size:.9rem}
::selection{background:var(--primary);color:#04140c}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script>
/* ============================================================================
   CONFIG
   ============================================================================ */
const CONFIG = {
  SUPABASE_URL:      'https://nnoymzdynrlpyxlrbqqn.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ub3ltemR5bnJscHl4bHJicXFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2MzAzMzMsImV4cCI6MjEwNTIwNjMzM30.4Z7fcWjfskVeVKdZF779LsQmWsFKpu-9Qq7CGISso0M',
  LOGIN_PAGE:        'login.html',
  MATCH_PAGE:        'match.html',
  PAGE_SIZE:         20,
  CURRENCY:          '₦',
  DEBUG:             true
};

const $  = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const log  = (...a) => { if (CONFIG.DEBUG) console.log('[DLS]', ...a); };
const warn = (...a) => console.warn('[DLS]', ...a);
const err  = (...a) => console.error('[DLS]', ...a);

const UI = {
  toast(msg, type='info', ms=4200){
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    const icon = type==='ok' ? '✓' : type==='err' ? '✕' : 'ℹ';
    el.innerHTML = `<span style="font-weight:800">${icon}</span><span>${msg}</span>`;
    $('#toasts').appendChild(el);
    setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),240); }, ms);
  },
  escape(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; },
  initials(n){ if(!n) return '?'; return n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); },
  money(n){ return CONFIG.CURRENCY + Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:0,maximumFractionDigits:0}); },
  date(iso){
    if (!iso) return '—';
    try { return new Date(iso).toLocaleString('en-NG',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
    catch { return '—'; }
  },
  timeAgo(iso){
    if (!iso) return '';
    const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s/60)+'m ago';
    if (s < 86400) return Math.floor(s/3600)+'h ago';
    if (s < 604800) return Math.floor(s/86400)+'d ago';
    return UI.date(iso);
  }
};

/* ============================================================================
   SUPABASE
   ============================================================================ */
const Supa = (() => {
  const HAS = Boolean(
    CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY &&
    window.supabase && typeof window.supabase.createClient === 'function'
  );
  let client = null;
  if (HAS){
    try {
      client = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
        auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:'dls_stake_auth' }
      });
      log('Supabase ready');
    } catch(e){ err('client fail:', e); }
  } else warn('No Supabase config — DEMO MODE');
  return { client, HAS };
})();

/* ============================================================================
   STATE
   ============================================================================ */
const State = {
  session: null,
  profile: null,
  allMatches: [],
  filtered: [],
  wallet: 'real',       // 'real' | 'demo'
  outcome: 'all',       // 'all' | 'win' | 'loss' | 'draw' | 'pending'
  period: 'all',        // 'all' | 'month' | 'week'
  page: 1,
  loading: true
};

/* ============================================================================
   AUTH
   ============================================================================ */
const Auth = {
  async getSession(){
    if (!Supa.HAS){
      try {
        const raw = localStorage.getItem('dls_demo_session');
        return raw ? { data:{ session: JSON.parse(raw) } } : { data:{ session:null } };
      } catch { return { data:{ session:null } }; }
    }
    try { const { data } = await Supa.client.auth.getSession(); return { data: data || { session:null } }; }
    catch(e){ err('getSession:', e); return { data:{ session:null } }; }
  },

  async fetchProfile(id){
    if (!Supa.HAS){
      const users = JSON.parse(localStorage.getItem('dls_demo_users') || '[]');
      return users.find(u => u.id === id) || null;
    }
    try {
      const { data } = await Supa.client.from('profiles').select('*').eq('id', id).maybeSingle();
      return data || null;
    } catch(e){ err('fetchProfile:', e); return null; }
  }
};

/* ============================================================================
   MATCHES DB
   ============================================================================ */
const Matches = {
  async listForUser(userId){
    if (!Supa.HAS) return Demo.listForUser(userId);
    try {
      const { data, error } = await Supa.client
        .from('matches')
        .select(`
          *,
          creator:profiles!matches_creator_id_fkey(id, username, dls_username),
          opponent:profiles!matches_opponent_id_fkey(id, username, dls_username)
        `)
        .or(`creator_id.eq.${userId},opponent_id.eq.${userId}`)
        .in('status', ['settled','cancelled','disputed','verifying','awaiting_submission','accepted'])
        .order('created_at', { ascending: false })
        .limit(200);
      if (error) throw error;
      return data || [];
    } catch(e){
      warn('listForUser:', e.message);
      return [];
    }
  }
};

/* ============================================================================
   DEMO BACKEND
   ============================================================================ */
const Demo = (() => {
  const KEY = 'dls_demo_matches';

  function seed(userId){
    const now = Date.now();
    const h = (n) => new Date(now - n * 3600000).toISOString();
    const d = (n) => new Date(now - n * 86400000).toISOString();

    const opps = [
      { id:'o1', username:'ChidiThunder', dls_username:'chidi_tt' },
      { id:'o2', username:'KunleStrikes', dls_username:'kunle_dls' },
      { id:'o3', username:'AmakaGoals',   dls_username:'amaka_g' },
      { id:'o4', username:'TundeBlaze',   dls_username:'tunde_bz' },
      { id:'o5', username:'NgoziQueen',   dls_username:'ngozi_q' },
      { id:'o6', username:'IbrahimKing',  dls_username:'ibra_king' }
    ];

    const me = { id: userId, username:'You', dls_username:'you_dls' };

    const rows = [
      { code:'DLS-4K9X', opp:opps[0], meScore:3, oppScore:1, pot:5000,  type:'real', status:'settled', when:h(3),  winnerMe:true },
      { code:'DLS-7Q2P', opp:opps[1], meScore:1, oppScore:2, pot:2500,  type:'real', status:'settled', when:h(20), winnerMe:false },
      { code:'DLS-9M4N', opp:opps[2], meScore:2, oppScore:2, pot:3000,  type:'real', status:'settled', when:h(30), winnerMe:null },
      { code:'DLS-2R8V', opp:opps[3], meScore:4, oppScore:0, pot:10000, type:'real', status:'settled', when:d(2),  winnerMe:true },
      { code:'DLS-5T1B', opp:opps[4], meScore:1, oppScore:3, pot:5000,  type:'real', status:'settled', when:d(3),  winnerMe:false },
      { code:'DLS-8L6C', opp:opps[5], meScore:3, oppScore:2, pot:2000,  type:'real', status:'settled', when:d(4),  winnerMe:true },
      { code:'DLS-3F7D', opp:opps[0], meScore:null, oppScore:null, pot:2500, type:'real', status:'awaiting_submission', when:h(0.5), winnerMe:null },
      { code:'DLS-1P5G', opp:opps[1], meScore:5, oppScore:3, pot:10000, type:'demo', status:'settled', when:h(5),  winnerMe:true },
      { code:'DLS-6K9H', opp:opps[2], meScore:2, oppScore:1, pot:5000,  type:'demo', status:'settled', when:h(26), winnerMe:true },
      { code:'DLS-4V2J', opp:opps[3], meScore:0, oppScore:2, pot:5000,  type:'demo', status:'settled', when:d(1.5), winnerMe:false },
      { code:'DLS-9B3L', opp:opps[4], meScore:3, oppScore:3, pot:2500,  type:'demo', status:'settled', when:d(2.5), winnerMe:null },
      { code:'DLS-2N8M', opp:opps[5], meScore:4, oppScore:1, pot:7500,  type:'demo', status:'settled', when:d(3.5), winnerMe:true }
    ];

    return rows.map((r, i) => ({
      id: 'demo-match-' + (i+1),
      match_code: r.code,
      creator_id: r.winnerMe === true ? me.id : r.opp.id,
      opponent_id: r.winnerMe === true ? r.opp.id : me.id,
      creator: r.winnerMe === true ? me : r.opp,
      opponent: r.winnerMe === true ? r.opp : me,
      creator_score: r.winnerMe === true ? r.meScore : r.oppScore,
      opponent_score: r.winnerMe === true ? r.oppScore : r.meScore,
      stake_amount: r.pot / 2,
      pot_amount: r.pot,
      platform_fee: r.type === 'demo' ? 0 : Math.round(r.pot * 0.04),
      game_type: r.type,
      status: r.status,
      winner_id: r.winnerMe === true ? me.id : r.winnerMe === false ? r.opp.id : null,
      created_at: r.when,
      settled_at: r.status === 'settled' ? r.when : null,
      verification_verdict: r.status === 'settled' ? 'matched' : null,
      _meScore: r.meScore,
      _oppScore: r.oppScore,
      _opp: r.opp,
      _isMeCreator: r.winnerMe === true
    }));
  }

  function read(){
    try { return JSON.parse(localStorage.getItem(KEY) || '[]'); }
    catch { return []; }
  }

  return {
    listForUser(userId){
      let rows = read().filter(m => m.creator_id === userId || m.opponent_id === userId);
      if (!rows.length){
        rows = seed(userId);
        /* Don't write into the shared matches store — keep demo history separate */
        try { localStorage.setItem('dls_demo_history_seed', '1'); } catch {}
      }
      return rows;
    }
  };
})();

/* ============================================================================
   HISTORY PAGE
   ============================================================================ */
const History = {

  async init(){
    log('History init');

    const { data } = await Auth.getSession();
    State.session = data.session;
    if (!State.session?.user){
      UI.toast('Please sign in first.', 'err');
      setTimeout(()=>location.href = CONFIG.LOGIN_PAGE, 600);
      return;
    }

    State.profile = await Auth.fetchProfile(State.session.user.id);
    State.wallet = State.profile?.account_type === 'demo' ? 'demo' : 'real';

    this.renderNav();
    await this.reload();

    window.addEventListener('focus', () => this.reload(true));
  },

  renderNav(){
    const u = State.session?.user;
    const p = State.profile;
    const name = p?.username || u?.user_metadata?.username || u?.email?.split('@')[0] || 'Player';
    const a = $('#navAvatar'); if (a) a.textContent = UI.initials(name);
    const n = $('#navName');   if (n) n.textContent = name;
  },

  async reload(silent){
    State.loading = true;
    this.render();

    try {
      State.allMatches = await Matches.listForUser(State.session.user.id);
    } catch(e){
      err('reload:', e);
      State.allMatches = [];
      UI.toast('Failed to load match history.', 'err');
    }

    State.loading = false;
    this.applyFilters();
    if (!silent) log('History loaded —', State.allMatches.length, 'matches');
  },

  /* ── Filtering ─────────────────────────────────────────────── */
  walletMatches(){
    const uid = State.session?.user?.id;
    return State.allMatches.filter(m => {
      const isDemo = m.game_type === 'demo';
      if (State.wallet === 'demo' && !isDemo) return false;
      if (State.wallet === 'real' && isDemo) return false;
      /* Only show matches that involve me */
      return m.creator_id === uid || m.opponent_id === uid;
    });
  },

  outcomeOf(m){
    const uid = State.session?.user?.id;
    if (m.status === 'settled'){
      if (!m.winner_id) return 'draw';
      return m.winner_id === uid ? 'win' : 'loss';
    }
    if (m.status === 'cancelled') return 'cancelled';
    return 'pending';
  },

  applyFilters(){
    let rows = this.walletMatches();

    /* Outcome */
    if (State.outcome !== 'all'){
      rows = rows.filter(m => this.outcomeOf(m) === State.outcome);
    }

    /* Period */
    if (State.period !== 'all'){
      const now = Date.now();
      const cutoff = State.period === 'week' ? now - 7 * 864e5 : now - 30 * 864e5;
      rows = rows.filter(m => new Date(m.created_at).getTime() >= cutoff);
    }

    State.filtered = rows;
    State.page = 1;
    this.render();
  },

  setWallet(w){ State.wallet = w; this.applyFilters(); },
  setOutcome(o){ State.outcome = o; this.applyFilters(); },
  setPeriod(p){ State.period = p; this.applyFilters(); },
  loadMore(){ State.page++; this.render(); },

  /* ── Stats for the summary bar ─────────────────────────────── */
  computeStats(){
    const rows = this.walletMatches().filter(m => m.status === 'settled');
    const uid = State.session?.user?.id;
    let won = 0, lost = 0, drawn = 0, netPnl = 0;

    rows.forEach(m => {
      const isCreator = m.creator_id === uid;
      const myScore = isCreator ? m.creator_score : m.opponent_score;
      const oppScore = isCreator ? m.opponent_score : m.creator_score;
      const pot = Number(m.pot_amount || (m.stake_amount || 0) * 2);
      const fee = Number(m.platform_fee || (m.game_type === 'demo' ? 0 : pot * 0.04));
      const stake = Number(m.stake_amount || pot / 2);

      if (!m.winner_id){ drawn++; return; }
      if (m.winner_id === uid){ won++; netPnl += (pot - fee) - stake; }
      else { lost++; netPnl -= stake; }
    });

    return {
      played: rows.length,
      won, lost, drawn,
      netPnl,
      winrate: rows.length > 0 ? (won / rows.length) * 100 : 0
    };
  },

  /* ── Render ────────────────────────────────────────────────── */
  render(){
    const body = $('#body');
    if (!body) return;

    if (State.loading){
      body.innerHTML = `<div class="loading-card"><span class="spin"></span> Loading your match history…</div>`;
      return;
    }

    const wm = this.walletMatches();
    const stats = this.computeStats();

    const walletCounts = {
      real: State.allMatches.filter(m => m.game_type !== 'demo' && (m.creator_id === State.session.user.id || m.opponent_id === State.session.user.id)).length,
      demo: State.allMatches.filter(m => m.game_type === 'demo' && (m.creator_id === State.session.user.id || m.opponent_id === State.session.user.id)).length
    };

    const outcomeCounts = {
      all: wm.length,
      win: wm.filter(m => this.outcomeOf(m) === 'win').length,
      loss: wm.filter(m => this.outcomeOf(m) === 'loss').length,
      draw: wm.filter(m => this.outcomeOf(m) === 'draw').length,
      pending: wm.filter(m => this.outcomeOf(m) === 'pending').length
    };

    if (!wm.length && !State.filtered.length){
      body.innerHTML = this.emptyHtml();
      return;
    }

    const visible = State.filtered.slice(0, State.page * CONFIG.PAGE_SIZE);
    const hasMore = State.filtered.length > visible.length;

    body.innerHTML = `
      <!-- SUMMARY -->
      <div class="summary">
        <div class="sum-card">
          <div class="k">Played</div>
          <div class="v blue">${stats.played}</div>
          <div class="sub">${State.wallet === 'demo' ? 'Demo matches' : 'Real matches'}</div>
        </div>
        <div class="sum-card green-glow">
          <div class="k">Won</div>
          <div class="v green">${stats.won}</div>
          <div class="sub">${stats.winrate.toFixed(0)}% win rate</div>
        </div>
        <div class="sum-card fire-glow">
          <div class="k">Lost</div>
          <div class="v fire">${stats.lost}</div>
          <div class="sub">${stats.drawn} drawn</div>
        </div>
        <div class="sum-card">
          <div class="k">Net P&L</div>
          <div class="v ${stats.netPnl >= 0 ? 'green' : 'fire'}">${stats.netPnl >= 0 ? '+' : '−'}${UI.money(Math.abs(stats.netPnl))}</div>
          <div class="sub">After platform fees</div>
        </div>
      </div>

      <!-- CONTROLS -->
      <div class="controls">
        <div class="filter-row">
          <button class="chip ${State.wallet==='real'?'active':''}" onclick="History.setWallet('real')">
            💰 Real <span class="cnt">${walletCounts.real}</span>
          </button>
          <button class="chip demo ${State.wallet==='demo'?'active':''}" onclick="History.setWallet('demo')">
            🎮 Demo <span class="cnt">${walletCounts.demo}</span>
          </button>
        </div>

        <div class="filter-row">
          <button class="chip ${State.outcome==='all'?'active':''}" onclick="History.setOutcome('all')">All <span class="cnt">${outcomeCounts.all}</span></button>
          <button class="chip ${State.outcome==='win'?'active':''}" onclick="History.setOutcome('win')">Wins <span class="cnt">${outcomeCounts.win}</span></button>
          <button class="chip ${State.outcome==='loss'?'active':''}" onclick="History.setOutcome('loss')">Losses <span class="cnt">${outcomeCounts.loss}</span></button>
          <button class="chip ${State.outcome==='draw'?'active':''}" onclick="History.setOutcome('draw')">Draws <span class="cnt">${outcomeCounts.draw}</span></button>
          <button class="chip ${State.outcome==='pending'?'active':''}" onclick="History.setOutcome('pending')">Pending <span class="cnt">${outcomeCounts.pending}</span></button>
        </div>

        <div class="filter-row">
          <button class="chip ${State.period==='all'?'active':''}" onclick="History.setPeriod('all')">All time</button>
          <button class="chip ${State.period==='month'?'active':''}" onclick="History.setPeriod('month')">This month</button>
          <button class="chip ${State.period==='week'?'active':''}" onclick="History.setPeriod('week')">This week</button>
        </div>
      </div>

      <!-- LIST -->
      ${visible.length ? `
        <div class="list">
          ${visible.map(m => this.matchCard(m)).join('')}
        </div>
      ` : `
        <div class="empty" style="padding:44px 22px">
          <div class="ico">🔍</div>
          <h3>No matches match these filters</h3>
          <p>Try clearing the outcome or period filters above.</p>
          <button class="btn btn-ghost btn-sm" onclick="History.clearFilters()">Clear filters</button>
        </div>
      `}

      ${hasMore ? `
        <div class="load-more">
          <button class="btn btn-ghost" onclick="History.loadMore()">Load ${Math.min(CONFIG.PAGE_SIZE, State.filtered.length - visible.length)} more</button>
        </div>
      ` : ''}
    `;

    /* Wire card clicks */
    $$('.match-card').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.dataset.id;
        if (id && !id.startsWith('demo-match-')){
          location.href = CONFIG.MATCH_PAGE + '?id=' + id;
        } else if (id){
          /* Demo matches have no real match page — show a toast */
          UI.toast('This is a demo match — no detail page available.', 'info');
        }
      });
    });
  },

  clearFilters(){
    State.outcome = 'all';
    State.period = 'all';
    this.applyFilters();
  },

  emptyHtml(){
    return `
      <div class="empty">
        <div class="ico">🎮</div>
        <h3>No matches in this wallet yet</h3>
        <p>${State.wallet === 'demo'
          ? 'Play a demo match to try things out — no real money involved.'
          : 'Challenge someone from the lobby to start building your match history.'}</p>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="location.href='${State.wallet === 'demo' ? 'lobby.html?mode=demo' : 'create-match.html'}'">
            ${State.wallet === 'demo' ? 'Try a demo match' : 'Create a match'}
          </button>
          <button class="btn btn-ghost" onclick="History.setWallet('${State.wallet === 'demo' ? 'real' : 'demo'}')">
            Switch to ${State.wallet === 'demo' ? 'real' : 'demo'}
          </button>
        </div>
      </div>`;
  },

  matchCard(m){
    const uid = State.session?.user?.id;
    const isCreator = m.creator_id === uid;
    const me  = isCreator ? m.creator  : m.opponent;
    const opp = isCreator ? m.opponent : m.creator;

    /* Resolve scores from the viewer's perspective */
    const myScore  = m._meScore  != null ? m._meScore  : (isCreator ? m.creator_score  : m.opponent_score);
    const oppScore = m._oppScore != null ? m._oppScore : (isCreator ? m.opponent_score : m.creator_score);
    const oppName  = m._opp?.username || opp?.username || 'Opponent';
    const oppDls   = m._opp?.dls_username || opp?.dls_username || '—';
    const meName   = State.profile?.username || me?.username || 'You';

    const outcome = this.outcomeOf(m);
    const cls = outcome === 'win' ? 'win' : outcome === 'loss' ? 'loss' : outcome === 'draw' ? 'draw' : 'pending';

    const badgeMap = {
      win:     `<span class="badge win"><i></i> Won</span>`,
      loss:    `<span class="badge loss"><i></i> Lost</span>`,
      draw:    `<span class="badge draw"><i></i> Draw</span>`,
      cancelled:`<span class="badge draw"><i></i> Cancelled</span>`,
      pending: `<span class="badge pending"><i></i> Pending</span>`
    };

    const typeBadge = m.game_type === 'demo'
      ? `<span class="badge demo"><i></i> Demo</span>`
      : `<span class="badge real"><i></i> Real</span>`;

    /* Score classes */
    const meCls  = outcome === 'win' ? 'w' : outcome === 'loss' ? 'l' : 'd';
    const oppCls = outcome === 'win' ? 'l' : outcome === 'loss' ? 'w' : 'd';

    /* Payout */
    let payoutHtml = '—';
    if (m.status === 'settled'){
      const pot = Number(m.pot_amount || (m.stake_amount || 0) * 2);
      const fee = Number(m.platform_fee || (m.game_type === 'demo' ? 0 : pot * 0.04));
      const stake = Number(m.stake_amount || pot / 2);
      if (!m.winner_id){
        payoutHtml = `<span class="mc-payout neu">±${UI.money(stake)}</span>`;
      } else if (m.winner_id === uid){
        payoutHtml = `<span class="mc-payout pos">+${UI.money(pot - fee)}</span>`;
      } else {
        payoutHtml = `<span class="mc-payout neg">−${UI.money(stake)}</span>`;
      }
    } else if (m.status === 'cancelled'){
      payoutHtml = `<span class="mc-payout neu">Refunded</span>`;
    } else {
      payoutHtml = `<span class="mc-payout neu">In escrow</span>`;
    }

    const pot = Number(m.pot_amount || (m.stake_amount || 0) * 2);

    return `
      <div class="match-card ${cls}" data-id="${UI.escape(m.id)}">
        <div class="mc-head">
          <div class="mc-badges">
            ${badgeMap[outcome] || badgeMap.pending}
            ${typeBadge}
            <span class="mc-code">${UI.escape(m.match_code || (m.id || '').slice(0,8))}</span>
          </div>
          <span class="mc-when">${UI.escape(UI.timeAgo(m.created_at))}</span>
        </div>

        <div class="mc-body">
          <div class="mc-player">
            <div class="avatar">${UI.escape(UI.initials(meName))}</div>
            <div class="txt">
              <h4>${UI.escape(meName)} <span class="you-tag">You</span></h4>
              <p>${UI.escape(State.profile?.dls_username || me?.dls_username || '—')}</p>
            </div>
          </div>

          <div class="mc-score">
            ${myScore != null && oppScore != null ? `
              <div class="nums">
                <span class="${meCls}">${myScore}</span>
                <span class="sep">–</span>
                <span class="${oppCls}">${oppScore}</span>
              </div>
              <div class="lbl">Final</div>
            ` : `
              <div class="nums" style="opacity:.55"><span>–</span><span class="sep">:</span><span>–</span></div>
              <div class="lbl">Awaiting</div>
            `}
          </div>

          <div class="mc-player right">
            <div class="avatar opp">${UI.escape(UI.initials(oppName))}</div>
            <div class="txt">
              <h4>${UI.escape(oppName)}</h4>
              <p>${UI.escape(oppDls)}</p>
            </div>
          </div>
        </div>

        <div class="mc-foot">
          <div class="mc-stat">
            <div class="item">
              <div class="k">Pot</div>
              <div class="v">${UI.money(pot)}</div>
            </div>
            <div class="item">
              <div class="k">Stake</div>
              <div class="v">${UI.money(Number(m.stake_amount || pot / 2))}</div>
            </div>
            ${m.settled_at ? `
              <div class="item">
                <div class="k">Settled</div>
                <div class="v">${UI.escape(UI.timeAgo(m.settled_at))}</div>
              </div>
            ` : ''}
          </div>
          ${payoutHtml}
        </div>
      </div>
    `;
  }
};
